<style>
:root{--paper:#F4F7F2;--ink:#16213A;--muted:#5B667A;--line:#D3DCD1;--field:#fff;--accent:#0E7C66;--on:#fff;--danger:#B4442A;--in:#0E7C66;--in-bg:rgba(14,124,102,.12);--inv:#3B5BDB;--inv-bg:rgba(59,91,219,.12)}
@media (prefers-color-scheme:dark){:root{--paper:#0E1626;--ink:#E6ECF7;--muted:#93A0B8;--line:#23304A;--field:#142038;--accent:#56C7A8;--on:#0E1626;--danger:#F08A70;--in:#56C7A8;--in-bg:rgba(86,199,168,.16);--inv:#8CA2FF;--inv-bg:rgba(140,162,255,.16)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 0}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 20px;margin-bottom:24px}
.head h1{margin:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#st{font-size:.85rem;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}
.lbl{display:block;font-size:.85rem;color:var(--muted)}
.tot{font-size:1.6rem;font-weight:800;line-height:1.1;margin:2px 0 18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big{font-size:2.6rem;font-weight:800;line-height:1.1;margin:2px 0 16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0}
.stats div+div{border-top:1px solid var(--line)}
.stats b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.del{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px;font-size:.9rem}
.del:hover{color:var(--danger)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{font-size:.85rem;color:var(--muted)}
.span2{grid-column:1/-1}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:4px;font-variant-numeric:tabular-nums}
.top input{width:auto;margin:0}
.rule{margin-top:10px}
.rule summary{cursor:pointer;font-size:.85rem;color:var(--muted);padding:4px 0}
.rule .fields{margin-top:8px}
.addbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--line)}
.add{width:100%;background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:14px;font-weight:700;font-size:1rem}
.add-desk{display:none}
[hidden]{display:none!important}
.sumhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:2px 0}
.take{display:block;width:100%;margin:0 0 14px;background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:12px;font-weight:700;font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:5;display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;font-size:.9rem}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:2px}
.goal{margin-top:20px}
.gbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.gfill{height:100%;width:0;background:var(--accent)}
.gtxt{margin:6px 0 0;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
#chart{margin-top:12px}
#chart svg{width:100%;height:auto;display:block}
.month{margin-top:16px}
.month summary{cursor:pointer;font-size:.9rem;color:var(--muted);padding:4px 0}
.mtab{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:6px}
.mtab th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px 4px 0}
.mtab td{padding:6px 6px 6px 0;border-top:1px solid var(--line)}
.mtab th:not(:first-child),.mtab td:not(:first-child){text-align:right;padding-right:0}
.acct{position:relative}
.avatar{position:relative;width:38px;height:38px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--accent);color:var(--on);font-weight:800;font-size:1rem;display:grid;place-items:center;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.guest{background:var(--line);color:var(--ink)}
.avatar svg{width:20px;height:20px;fill:currentColor}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:250px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.menu .em{padding:8px 10px 10px;font-size:.85rem;color:var(--muted);word-break:break-all;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:10px;border-radius:8px;font-size:.95rem}
.menu button:hover{background:var(--line)}
.menu .out{color:var(--danger)}
.menu .pv{margin:6px 10px 4px;padding-top:8px;border-top:1px solid var(--line);font-size:.78rem;line-height:1.4;color:var(--muted)}
.mhead{font-size:.85rem;font-weight:600;color:var(--muted);padding:16px 0 6px}
.item{border-top:1px solid var(--line)}
.irow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
.irow::-webkit-details-marker{display:none}
.idate{font-size:.85rem;color:var(--muted)}
.imid{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.inote{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.iamt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-tas,.b-bank{background:var(--in-bg);color:var(--in)}
.b-invest{background:var(--inv-bg);color:var(--inv)}
.b-pindah{background:var(--line);color:var(--muted)}
.a-tas,.a-bank{color:var(--in)}
.a-invest{color:var(--inv)}
.cyc{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);padding:12px 0 2px}
.cyc .line{flex:1;height:1px;background:var(--line)}
.edit{padding:2px 0 16px}
.empty{color:var(--muted);padding:24px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600}
.chip[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:18px;width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dhead h2{font-size:1.1rem;margin:0}
.qerr{margin:10px 0 0;font-size:.85rem;color:var(--danger)}
.pbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--accent)}
