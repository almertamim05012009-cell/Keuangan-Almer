<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Keuangan Almer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F7F2;--ink:#16213A;--muted:#5B667A;--line:#D3DCD1;--field:#fff;--accent:#0E7C66;--on:#fff;--danger:#B4442A}
@media (prefers-color-scheme:dark){:root{--paper:#0E1626;--ink:#E6ECF7;--muted:#93A0B8;--line:#23304A;--field:#142038;--accent:#56C7A8;--on:#0E1626;--danger:#F08A70}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 0}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 20px;margin-bottom:24px}
.head h1{margin:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#st{font-size:.85rem;color:var(--muted)}
.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}
.lbl{display:block;font-size:.85rem;color:var(--muted)}
.tot{font-size:1.6rem;font-weight:800;line-height:1.1;margin:2px 0 18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big{font-size:2.6rem;font-weight:800;line-height:1.1;margin:2px 0 16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0}
.stats div+div{border-top:1px solid var(--line)}
.stats b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.del{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px;font-size:.9rem}
.del:hover{color:var(--danger)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{font-size:.85rem;color:var(--muted)}
.span2{grid-column:1/-1}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:4px;font-variant-numeric:tabular-nums}
.top input{width:auto;margin:0}
.rule{margin-top:10px}
.rule summary{cursor:pointer;font-size:.85rem;color:var(--muted);padding:4px 0}
.rule .fields{margin-top:8px}
.addbar{position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--line)}
.add{width:100%;background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:14px;font-weight:700;font-size:1rem}
.add-desk{display:none}
[hidden]{display:none!important}
.sumhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:2px 0}
.take{display:block;width:100%;margin:0 0 14px;background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:12px;font-weight:700;font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:5;display:flex;align-items:center;gap:16px;max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;font-size:.9rem}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:2px}
.goal{margin-top:20px}
.gbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.gfill{height:100%;width:0;background:var(--accent)}
.gtxt{margin:6px 0 0;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
#chart{margin-top:12px}
#chart svg{width:100%;height:auto;display:block}
.month{margin-top:16px}
.month summary{cursor:pointer;font-size:.9rem;color:var(--muted);padding:4px 0}
.mtab{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:6px}
.mtab th{text-align:left;font-weight:600;color:var(--muted);padding:4px 6px 4px 0}
.mtab td{padding:6px 6px 6px 0;border-top:1px solid var(--line)}
.mtab th:not(:first-child),.mtab td:not(:first-child){text-align:right;padding-right:0}
.foot{display:flex;gap:10px;flex-wrap:wrap;padding:24px 0 40px}
.hide .tot,.hide .big,.hide .stats b,.hide .take,.hide .rule summary span,.hide input[type=number],.hide .gtxt,.hide .mtab td:not(:first-child){filter:blur(7px)}
.hide input[type=number]:focus{filter:none}
@media (hover:hover){.add:hover,.take:hover{filter:brightness(1.08)}.btn:hover{background:var(--line)}.btn.pri:hover{background:var(--accent);filter:brightness(1.08)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:880px){
  main{max-width:1040px;padding:40px 24px}
  .head{margin-bottom:36px}
  h1{font-size:1.8rem}
  .layout{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:start}
  .summary{position:sticky;top:24px}
  .big{font-size:3rem}
  .addbar{display:none}
  .add-desk{display:block;width:100%;margin-top:20px}
  .row:first-child{padding-top:0}
  .toast{bottom:24px}
}
</style>
</head>
<body>
<main>
<header class="head">
  <h1>Keuangan Almer</h1>
  <div class="bar">
    <button id="login" class="btn pri" onclick="login()">Masuk dengan Google</button>
    <button id="logout" class="btn" onclick="logout()" style="display:none">Keluar</button>
    <span id="st"></span>
  </div>
</header>

<div class="layout">
  <section class="summary">
    <div class="sumhead"><span class="lbl">Total uang yang didapat</span><button id="eye" class="link" onclick="toggleHide()">Sembunyikan angka</button></div>
    <p class="tot" id="tTotal">Rp 0</p>
    <span class="lbl">Harus diinvestasikan</span>
    <p class="big" id="tTarget">Rp 0</p>
    <button class="take" id="takeBtn" onclick="takeAll()" hidden></button>
    <div class="stats">
      <div><span class="lbl">Uang di tas</span><b id="tTas">Rp 0</b></div>
      <div><span class="lbl">Uang di bank</span><b id="tBank">Rp 0</b></div>
      <div><span class="lbl">Sudah diinvestasikan</span><b id="tInv">Rp 0</b></div>
    </div>

    <details class="rule">
      <summary>Aturan investasi: <span id="rs"></span></summary>
      <div class="fields">
        <label class="span2">Batas total uang yang didapat (Rp)<input id="rLimit" type="number" inputmode="numeric" min="0" oninput="setRule('limit',this.value)"></label>
        <label>Persen di bawah batas<input id="rLow" type="number" inputmode="decimal" min="0" max="100" step="any" oninput="setRule('low',this.value)"></label>
        <label>Persen mulai batas<input id="rHigh" type="number" inputmode="decimal" min="0" max="100" step="any" oninput="setRule('high',this.value)"></label>
      </div>
    </details>

    <button class="add add-desk" onclick="add()">+ Tambah baris</button>

    <div class="goal">
      <label class="lbl" for="goalIn">Target tabungan (Rp)</label>
      <input id="goalIn" type="number" inputmode="numeric" min="0" placeholder="Contoh: 5000000" oninput="setGoal(this.value)">
      <div class="gbar" id="gbar" hidden><div class="gfill" id="gfill"></div></div>
      <p class="gtxt" id="gtxt" hidden></p>
      <div id="chart"></div>
    </div>

    <details class="month">
      <summary>Ringkasan bulanan</summary>
      <table class="mtab"><thead><tr><th>Bulan</th><th>Masuk</th><th>Diinvestasikan</th></tr></thead><tbody id="mbody"></tbody></table>
    </details>
  </section>

  <div class="entries">
    <div id="list"></div>
    <div class="addbar"><button class="add" onclick="add()">+ Tambah baris</button></div>
  </div>
</div>
<footer class="foot">
  <button class="btn" onclick="exportCsv()">Unduh cadangan (CSV)</button>
  <button class="btn" onclick="document.getElementById('imp').click()">Pulihkan dari file</button>
  <input type="file" id="imp" accept=".csv,text/csv" hidden onchange="importCsv(this)">
</footer>
<div id="toast" class="toast" hidden><span id="tmsg"></span><button id="tundo" onclick="undo()">Urungkan</button></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, doc, getDoc, setDoc, onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCuMJffEP5UNoZrfib_fALE1zrjSp2HNFI",
  authDomain: "keuangan-almer.firebaseapp.com",
  projectId: "keuangan-almer",
  storageBucket: "keuangan-almer.firebasestorage.app",
  messagingSenderId: "471689643532",
  appId: "1:471689643532:web:ea474812228b7660c61029",
  measurementId: "G-Y2NWY16QW8"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");
const st = document.getElementById("st");

// Jenis catatan: uang masuk ke tas, masuk ke bank, dipindah dari tas ke bank, atau diinvestasikan dari bank.
const T = {tas: "Pemasukan ke tas", bank: "Pemasukan ke bank", pindah: "Pindah dari tas ke bank", invest: "Investasi (dari bank)"};
const TYPES = Object.keys(T);

const num = (v, def, min, max) => {
  const n = Number(v);
  return v === undefined || v === null || v === "" || isNaN(n) ? def : Math.min(max, Math.max(min, n));
};
const today = () => {
  const t = new Date();
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

// Aturan investasi (satu untuk semua): batas Rp 500.000, 10% di bawah batas, 20% mulai dari batas.
const defRule = () => ({limit: 500000, low: 10, high: 20});
const cleanRule = x => ({limit: num(x && x.limit, 500000, 0, Infinity), low: num(x && x.low, 10, 0, 100), high: num(x && x.high, 20, 0, 100)});
// Versi lama menyimpan aturan di setiap baris: ambil dari baris terakhir.
function pickRule(x, rows) {
  if (!x && Array.isArray(rows) && rows.length) x = rows[rows.length - 1];
  return cleanRule(x);
}

const blank = () => ({date: today(), type: "tas", amount: 0, note: ""});
function clean(rows) {
  if (!Array.isArray(rows) || !rows.length) return [blank()];
  const out = [];
  rows.forEach(r => {
    if (!r) return;
    const date = String(r.date || ""), note = String(r.note || "").slice(0, 120);
    if (TYPES.includes(r.type)) {
      out.push({date: date, type: r.type, amount: num(r.amount, 0, 0, Infinity), note: note});
    } else {
      // Format lama: satu baris berisi uang masuk dan/atau investasi, dipecah jadi baris terpisah.
      const cash = num(r.cash, 0, 0, Infinity), inv = num(r.invested, 0, 0, Infinity);
      if (cash > 0 || inv === 0) out.push({date: date, type: "tas", amount: cash, note: note});
      if (inv > 0) out.push({date: date, type: "invest", amount: inv, note: cash > 0 ? "" : note});
    }
  });
  return out.length ? out : [blank()];
}
function hasData(rows) { return rows.some(r => r.amount || r.note); }

let d = [blank()], rule = defRule();
try {
  const raw = JSON.parse(localStorage.fin);
  d = clean(raw);
  let r0 = null;
  try { r0 = JSON.parse(localStorage.finRule); } catch (e) {}
  rule = pickRule(r0, raw);
} catch (e) {}
let goal = 0;
try { goal = Math.max(0, Number(localStorage.finGoal) || 0); } catch (e) {}

let user = null, timer = null, unsub = null, dirty = false, ver = 0;

function status(m) { st.textContent = m; }
function saveLocal() {
  try {
    localStorage.fin = JSON.stringify(d);
    localStorage.finGoal = String(goal);
    localStorage.finRule = JSON.stringify(rule);
  } catch (e) {}
}

// Penanda: ada perubahan di perangkat ini yang belum sampai ke akun.
function flag(on) {
  try {
    if (on) localStorage.finDirty = "1";
    else localStorage.removeItem("finDirty");
  } catch (e) {}
}

// Hapus semua data lokal (dipakai saat keluar akun).
function wipe() {
  d = [blank()];
  goal = 0;
  rule = defRule();
  try {
    localStorage.removeItem("fin");
    localStorage.removeItem("finOwner");
    localStorage.removeItem("finGoal");
    localStorage.removeItem("finRule");
    localStorage.removeItem("finDirty");
  } catch (e) {}
  draw();
}

function payload() { return {rows: d, goal: goal, rule: rule, updated: Date.now()}; }

function saveCloud() {
  if (!user) return;
  const u = user, v = ++ver;
  dirty = true;
  flag(true);
  status("Menyimpan...");
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      await setDoc(doc(db, "users", u.uid), payload());
      if (v === ver) { dirty = false; flag(false); status("Tersimpan di akun " + u.email); }
    } catch (e) {
      status("Gagal menyimpan ke akun. Data tetap aman di perangkat ini.");
    }
  }, 600);
}
function save() { saveLocal(); saveCloud(); }

function f(n) { return "Rp " + (+n).toLocaleString("id-ID"); }

// Hitungan:
// Total uang yang didapat = semua pemasukan (ke tas dan ke bank).
// Uang di tas = pemasukan ke tas - yang dipindah ke bank.
// Uang di bank = pemasukan ke bank + yang dipindah dari tas - yang diinvestasikan.
// Harus diinvestasikan = persen aturan x total uang yang didapat - yang sudah diinvestasikan.
function calc() {
  let tas = 0, bank = 0, got = 0, inv = 0;
  d.forEach(r => {
    if (r.type === "tas") { tas += r.amount; got += r.amount; }
    else if (r.type === "bank") { bank += r.amount; got += r.amount; }
    else if (r.type === "pindah") { tas -= r.amount; bank += r.amount; }
    else { bank -= r.amount; inv += r.amount; }
  });
  const pct = got >= rule.limit ? rule.high : rule.low;
  return {tas: tas, bank: bank, got: got, inv: inv, tar: Math.max(0, got * pct / 100 - inv)};
}

function refresh() {
  const x = calc(), sug = Math.round(x.tar);
  const tb = document.getElementById("takeBtn");
  tb.hidden = sug <= 0;
  tb.textContent = "Catat sudah diinvestasikan " + f(sug);
  document.getElementById("tTotal").textContent = f(x.got);
  document.getElementById("tTarget").textContent = f(sug);
  document.getElementById("tTas").textContent = f(Math.max(0, x.tas));
  document.getElementById("tBank").textContent = f(Math.max(0, x.bank));
  document.getElementById("tInv").textContent = f(x.inv);
  document.getElementById("rs").textContent =
    rule.low + "% di bawah " + f(rule.limit) + ", " + rule.high + "% mulai " + f(rule.limit);
  extras(x.inv);
}

function dl(s) { return new Date(s + "T00:00:00").toLocaleDateString("id-ID", {day: "numeric", month: "short", year: "numeric"}); }

// Target tabungan, ringkasan bulanan, dan grafik total investasi.
function extras(inv) {
  const bar = document.getElementById("gbar"), txt = document.getElementById("gtxt");
  bar.hidden = txt.hidden = !(goal > 0);
  if (goal > 0) {
    const p = Math.min(100, Math.round(inv / goal * 100));
    document.getElementById("gfill").style.width = p + "%";
    txt.textContent = inv >= goal ? "Target tercapai! " + f(inv) + " dari " + f(goal) : f(inv) + " dari " + f(goal) + " (" + p + "%)";
  }

  const m = {};
  d.forEach(r => {
    const k = /^\d{4}-\d{2}/.test(r.date) ? r.date.slice(0, 7) : "";
    m[k] = m[k] || {cash: 0, inv: 0};
    if (r.type === "tas" || r.type === "bank") m[k].cash += r.amount;
    else if (r.type === "invest") m[k].inv += r.amount;
  });
  document.getElementById("mbody").innerHTML = Object.keys(m).sort().reverse().map(k => {
    const lab = k ? new Date(k + "-01T00:00:00").toLocaleDateString("id-ID", {month: "long", year: "numeric"}) : "Tanpa tanggal";
    return `<tr><td>${lab}</td><td>${f(m[k].cash)}</td><td>${f(m[k].inv)}</td></tr>`;
  }).join("");

  const pts = d.filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const el = document.getElementById("chart");
  if (pts.length < 2) { el.innerHTML = ""; return; }
  let c = 0;
  const ys = pts.map(r => (c += r.type === "invest" ? r.amount : 0));
  const max = Math.max(goal, c, 1), W = 300, H = 90, P = 6;
  const X = i => P + (W - 2 * P) * i / (pts.length - 1);
  const Y = v => H - P - (H - 2 * P) * v / max;
  const line = ys.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");
  const gl = goal > 0 ? `<line x1="${P}" x2="${W - P}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" style="stroke:var(--muted)" stroke-dasharray="4 4"/>` : "";
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik total investasi dari waktu ke waktu">${gl}<polyline points="${line}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)"/><circle cx="${X(ys.length - 1).toFixed(1)}" cy="${Y(c).toFixed(1)}" r="4" style="fill:var(--accent)"/></svg><span class="lbl">Total investasi, ${dl(pts[0].date)} sampai ${dl(pts[pts.length - 1].date)}${goal > 0 ? " (garis putus-putus: target)" : ""}</span>`;
}

function draw() {
  list.innerHTML = d.map((r, i) => [r, i]).reverse().map(([r, i]) =>
    `<div class="row">
      <div class="top">
        <input type="date" aria-label="Tanggal" value="${esc(r.date)}" onchange="upd(${i},'date',this.value)">
        <button class="del" onclick="del(${i})">Hapus</button>
      </div>
      <div class="fields">
        <label class="span2">Jenis<select onchange="upd(${i},'type',this.value)">${TYPES.map(k => `<option value="${k}"${k === r.type ? " selected" : ""}>${T[k]}</option>`).join("")}</select></label>
        <label>Jumlah (Rp)<input type="number" inputmode="numeric" min="0" placeholder="0" value="${r.amount || ''}" oninput="upd(${i},'amount',this.value)"></label>
        <label>Catatan<input type="text" maxlength="120" placeholder="Boleh kosong" value="${esc(r.note)}" oninput="upd(${i},'note',this.value)"></label>
      </div>
    </div>`).join("");
  document.getElementById("goalIn").value = goal || "";
  document.getElementById("rLimit").value = rule.limit;
  document.getElementById("rLow").value = rule.low;
  document.getElementById("rHigh").value = rule.high;
  refresh();
}

window.upd = (i, k, v) => {
  d[i][k] = k === "amount" ? Math.max(0, +v || 0) : v;
  save();
  refresh();
};
window.add = () => {
  d.push(blank());
  save();
  draw();
  const first = list.querySelector(".row");
  if (first) {
    first.scrollIntoView({behavior: "smooth", block: "center"});
    const inp = first.querySelector("input[type=number]");
    if (inp) inp.focus({preventScroll: true});
  }
};

window.setGoal = v => { goal = Math.max(0, +v || 0); saveLocal(); saveCloud(); refresh(); };
window.setRule = (k, v) => {
  rule[k] = k === "limit" ? Math.max(0, +v || 0) : Math.min(100, Math.max(0, +v || 0));
  saveLocal();
  saveCloud();
  refresh();
};

// Satu tombol di atas: mencatat investasi sebagai baris baru.
window.takeAll = () => {
  const amt = Math.round(calc().tar);
  if (amt <= 0) return;
  const row = Object.assign(blank(), {type: "invest", amount: amt, note: "Investasi"});
  d.push(row);
  save();
  draw();
  undoRow = {added: row};
  toast("Investasi dicatat: " + f(amt), true);
};

// Pemberitahuan kecil di bawah layar, dengan tombol Urungkan.
let undoRow = null, toastTimer = null;
function toast(msg, canUndo) {
  document.getElementById("tmsg").textContent = msg;
  document.getElementById("tundo").hidden = !canUndo;
  document.getElementById("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { document.getElementById("toast").hidden = true; undoRow = null; }, 8000);
}
window.del = (i) => {
  undoRow = {row: d[i], at: i, only: d.length === 1};
  d.splice(i, 1);
  if (!d.length) d.push(blank());
  save();
  draw();
  toast("Baris dihapus", true);
};
window.undo = () => {
  if (!undoRow) return;
  if (undoRow.added) {
    const k = d.indexOf(undoRow.added);
    if (k >= 0) d.splice(k, 1);
    if (!d.length) d.push(blank());
  } else if (undoRow.only) d = [undoRow.row];
  else d.splice(Math.min(undoRow.at, d.length), 0, undoRow.row);
  undoRow = null;
  document.getElementById("toast").hidden = true;
  save();
  draw();
};

// Sembunyikan angka (disimpan di perangkat ini).
function applyHide() {
  let h = false;
  try { h = localStorage.finHide === "1"; } catch (e) {}
  document.body.classList.toggle("hide", h);
  document.getElementById("eye").textContent = h ? "Tampilkan angka" : "Sembunyikan angka";
}
window.toggleHide = () => {
  try { localStorage.finHide = localStorage.finHide === "1" ? "0" : "1"; } catch (e) {}
  applyHide();
};

// Cadangan: unduh dan pulihkan lewat file CSV.
function parseCsv(t, sep) {
  const out = [];
  let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); out.push(row); }
  return out;
}
window.exportCsv = () => {
  const q = s => {
    s = String(s);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const lines = ["tanggal;jenis;jumlah;catatan"].concat(d.map(r => [q(r.date), r.type, r.amount, q(r.note)].join(";")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "keuangan-almer-" + today() + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Cadangan diunduh", false);
};
window.importCsv = (inp) => {
  const file = inp.files[0];
  inp.value = "";
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const t = String(rd.result).replace(/^\ufeff/, "");
      const sep = t.split("\n")[0].includes(";") ? ";" : ",";
      const n = v => String(v == null ? "" : v).trim().replace(",", ".");
      const unq = v => String(v || "").replace(/^'(?=[=+\-@])/, "");
      const all = parseCsv(t, sep);
      const isNew = ((all[0] || [])[1] || "").trim().toLowerCase() === "jenis";
      const rows = all.slice(1).filter(c => c.some(x => x.trim() !== "")).map(c => isNew
        ? {date: (c[0] || "").trim(), type: (c[1] || "").trim(), amount: n(c[2]), note: unq(c[3])}
        : {date: (c[0] || "").trim(), cash: n(c[1]), invested: n(c[2]), note: unq(c[6])});
      if (!rows.length) { toast("File kosong atau formatnya tidak dikenali", false); return; }
      if (!confirm("Ganti semua data sekarang dengan isi file ini?")) return;
      d = clean(rows);
      save();
      draw();
      toast("Data dipulihkan: " + d.length + " baris", false);
    } catch (e) {
      toast("Gagal membaca file", false);
    }
  };
  rd.readAsText(file);
};

// Sinkronisasi antar perangkat: perubahan dari perangkat lain muncul otomatis.
function listen(u) {
  if (unsub) unsub();
  unsub = onSnapshot(doc(db, "users", u.uid), snap => {
    if (snap.metadata.hasPendingWrites || !snap.exists() || dirty) return;
    const rows = clean(snap.data().rows);
    const g = typeof snap.data().goal === "number" ? snap.data().goal : 0;
    const ru = pickRule(snap.data().rule, snap.data().rows);
    if (JSON.stringify(rows) === JSON.stringify(d) && g === goal && JSON.stringify(ru) === JSON.stringify(rule)) return;
    if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT")) return;
    d = rows; goal = g; rule = ru; saveLocal(); draw();
  }, () => {});
}

onAuthStateChanged(auth, async u => {
  user = u;
  document.getElementById("login").style.display = u ? "none" : "";
  document.getElementById("logout").style.display = u ? "" : "none";
  if (!u) {
    if (unsub) { unsub(); unsub = null; }
    // Data milik sebuah akun tidak boleh tampil kalau tidak ada yang masuk.
    try { if (localStorage.finOwner) wipe(); } catch (e) {}
    status("Belum masuk. Data hanya tersimpan di perangkat ini.");
    return;
  }
  status("Menyinkronkan...");
  let owner = "", unsynced = false;
  try { owner = localStorage.finOwner || ""; unsynced = !!localStorage.finDirty; } catch (e) {}
  try {
    const snap = await getDoc(doc(db, "users", u.uid));
    const cloud = snap.exists() ? clean(snap.data().rows) : null;
    const cg = snap.exists() && typeof snap.data().goal === "number" ? snap.data().goal : 0;
    const cr = snap.exists() ? pickRule(snap.data().rule, snap.data().rows) : defRule();
    status("Masuk sebagai " + u.email);
    if (owner && owner !== u.uid) {
      // Data di perangkat ini milik akun lain: jangan digabung.
      d = cloud || [blank()];
      goal = cg; rule = cr;
      flag(false);
    } else if (owner === u.uid && !unsynced) {
      // Data lokal milik akun ini dan sudah tersimpan: data akun yang terbaru.
      if (cloud) { d = cloud; goal = cg; rule = cr; }
      else if (hasData(d)) saveCloud();
    } else {
      // Data sebelum masuk, atau perubahan yang belum sempat tersimpan.
      if (cloud && hasData(cloud)) {
        if (JSON.stringify(cloud) !== JSON.stringify(d)) {
          if (!hasData(d) || confirm("Data di akun berbeda dengan data di perangkat ini.\n\nOK = pakai data akun\nBatal = pakai data perangkat ini (menimpa data akun)")) {
            d = cloud; goal = cg; rule = cr;
          } else {
            saveCloud();
          }
        }
      } else if (hasData(d)) {
        saveCloud();
      }
    }
    try { localStorage.finOwner = u.uid; } catch (e) {}
    saveLocal();
    draw();
    listen(u);
  } catch (e) {
    try { if (owner && owner !== u.uid) wipe(); } catch (x) {}
    status("Gagal terhubung ke database. Coba muat ulang halaman.");
  }
});

window.login = async () => {
  const p = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, p);
  } catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      signInWithRedirect(auth, p);
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      alert("Gagal masuk: " + (e.code || e.message));
    }
  }
};

window.logout = async () => {
  if (dirty && user) {
    // Simpan dulu perubahan terakhir sebelum data di perangkat dihapus.
    clearTimeout(timer);
    status("Menyimpan sebelum keluar...");
    try {
      await setDoc(doc(db, "users", user.uid), payload());
    } catch (e) {
      if (!confirm("Perubahan terakhir belum tersimpan ke akun. Tetap keluar? Perubahan itu akan hilang.")) {
        saveCloud();
        return;
      }
    }
  }
  clearTimeout(timer);
  dirty = false; ver++;
  if (unsub) { unsub(); unsub = null; }
  wipe();
  await signOut(auth);
};

applyHide();
draw();
</script>
